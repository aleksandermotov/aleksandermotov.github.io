<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Receta Tortilla</title>
        <style>
            body {
                width: 30%;
            }
            h1 {
                background-color: blue;
            }
            h2 {
                background-color: red;
            }
            p {
                font-family: fantasy;
                font-size: 16px;
                font-weight: bold;
                text-align: center;
            }
            ul li {
                font-style: italic;
                text-shadow: 1px 1px red;
            }
            ol li {
                text-shadow: 1px 1px blue;
            }
        </style>
    </head>
    <body>
        <h1>Receta de la tortilla francesa</h1>
        <p>Ingredientes:</p>
        <ul>
            <li>Huevos</li>
            <li>Aceite</li>
            <li>Sal</li>
        </ul>
        <p>Preparación:</p>
        <ol>
            <li>Calentar el aceite en una sartén</li>
            <li>Cascar el huevo y batirlo</li>
            <li>Verter el hueveo batido en la sartén</li>
            <li>Esperar un par de minutos, voltear y volver a esperar.</li>
        </ol>
        <h2>Servir con mayonesa, tomate o jamón</h2>
    </body>
</html>
