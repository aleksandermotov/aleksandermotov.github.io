<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Inscriptión</title>
    </head>
    <body>
        <form action="https://lm.ciclo.iesnervion.es/inscripcion.php" method="POST" enctype="multipart/form-data">
            <label for="equipo">Nombre del Equipo
                <input type="text" name="equipo" id="equipo" autofocus required>
            </label><br>
            <label for="codigo_registro">Código de Registro
                <input type="text" name="codigo_registro" id="codigo_registro" value="HACK-2026-SEV" readonly>
            </label><br>
            <label for="fecha">Fecha de llegada
                <input type="date" name="fecha" id="fecha" min="2026-12-01" max="2026-12-15" required>
            </label><br>
            <label for="hora">Hora de presentación
                <input type="time" name="hora" id="hora" required>
            </label><br>
            <label for="color">Color identificativo del equipo
                <input type="color" name="color" id="color" required>
            </label><br>
            <label for="nivel_java">Nivel estimado de Java
                <input type="range" name="nivel_java" id="nivel_java" min="0" max="100" step="5">
            </label><br>
            <label for="expediente">Subir Expediente / CV
                <input type="file" name="expediente" id="expediente" accept=".pdf" required> 
            </label><br>
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
