<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Encuesta</title>
    </head>
    <body>
        <form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="POST">
            <fieldset>
                <legend>Datos Académicos</legend>
                <label for="nombre">Nombre y Apellidos
                      <input type="text" name="nombre" id="nomre" required>
                </label><br>
                <label for="ciclo">Ciclo Formativo
                      <select name="ciclo" id=ciclo">
                        <option value="DAM" selected>DAM</option>
                        <option value="DAW">DAW</option>
                        <option value="ASIR">ASIR</option>
                     </select>
                 </label>         
            </fieldset>
            <fieldset>
                <legend>Preferencias Técnicas</legend>
                <label>Lenguaje principal
                    <input type="radio" name="lenguaje" value="Java">Java
                    <input type="radio" name="lenguaje" value="Python">Python
                    <input type="radio" name="lenguaje" value="C#">C#
                    <input type="radio" name="lenguaje" value="JavaScript">JavaScript
                </label><br>
                <label>Entornos de trabajo habituales
                    <input type="checkbox" name="entornos[]" value="Linux">Linux
                    <input type="checkbox" name="entornos[]" value="Windows">Windows
                    <input type="checkbox" name="entornos[]" value="macOS">macOS
                </label><br>
                <label for="comentarios">Comentarios / Experiencia previa<br>
                    <textarea name="comentarios" id="comentarios" rows="4" cols="40"></textarea>
                </label>
            </fieldset>
            <button type="reset">Restablecer</button>
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
