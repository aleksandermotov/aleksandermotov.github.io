<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Login</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">
          <label for="login">Nombre de usuario o Email
            <input type="text" name="usuario" id="usuario" placeholder="usuario@dominio.com" required>
          </label><br>
          <label for="password">Contraseña
            <input type="password" name="password" id="password" required>
          </label><br>
          <label for="recordad">Recordar sesión
            <input type="checkbox" name="recordad" id="recordad"> 
          </label><br>
          <button type="submit">Iniciar Sesión</button> 
        </form>
    </body>
</html>
